services:
  afterhours_sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afterhours_sentinel_engine
    restart: always
    network_mode: "host"
    environment:
      - PORT=${PORT:-9025}
      - DATABASE_URL=sqlite:///data/afterhours.db
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Kolkata
    entrypoint: ["/app/entrypoint.sh"]
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
      - ./test_videos:/app/test_videos
      - ./entrypoint.sh:/app/entrypoint.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
